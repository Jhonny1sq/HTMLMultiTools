<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PRISM Media Grabber — pull video or audio from a link." />
  <title>PRISM — Media Grabber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="downloader.css" />
</head>
<body class="grabber-page">
  <div class="aurora" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
  </div>
  <div class="grid-veil" aria-hidden="true"></div>

  <header class="nav">
    <a href="/" class="logo"><span class="logo-mark">◆</span><span class="logo-text">PRISM</span></a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/tools">Tools</a>
    </nav>
  </header>

  <main class="grabber">
    <div class="grabber-head reveal">
      <span class="eyebrow">media grabber</span>
      <h1>Pull <span class="gradient">video or audio</span><br />from any link.</h1>
      <p class="lede">Paste a YouTube URL. Choose a format. Every stream that matters, ranked best first — no clutter, no signup.</p>
    </div>

    <form id="grab-form" class="grab-form reveal" style="--d:.08s">
      <div class="field">
        <label for="url">Video URL</label>
        <div class="input-shell">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
          </span>
          <input id="url" name="url" type="url" placeholder="https://youtube.com/watch?v=…" required autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="mode-row" role="tablist" aria-label="Format">
        <button type="button" class="mode active" data-mode="mp4" role="tab" aria-selected="true">
          <span class="dot"></span> MP4 · video
        </button>
        <button type="button" class="mode" data-mode="mp3" role="tab" aria-selected="false">
          <span class="dot"></span> MP3 · audio
        </button>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" id="grab-btn">
        <span class="btn-label">Resolve streams</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
    </form>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <div class="thumb-shell">
          <img id="thumb" alt="" />
        </div>
        <div class="result-meta">
          <h2 id="title">—</h2>
          <p id="meta" class="muted"></p>
        </div>
      </div>
      <div id="streams" class="streams"></div>
      <div id="more-wrap" class="more-wrap" hidden>
        <button id="more-btn" type="button" class="btn btn-ghost">show more</button>
      </div>
    </section>

    <p id="status" class="status"></p>

    <div class="trust reveal" style="--d:.18s">
      <div><strong>client-side</strong><span>nothing logged</span></div>
      <div><strong>best-first</strong><span>quality ranked</span></div>
      <div><strong>0 accounts</strong><span>open and go</span></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="logo-text">PRISM</span>
      <p>One hub. Many tools.</p>
    </div>
  </footer>

  <script src="downloader.js"></script>
</body>
</html>
